####################################################################################################
# @file     .tmux.conf
# @brief    Personal defined tmux configuration file for using it powerful.
#
# @author   sheer.rey<sheer.rey@gmail.com>
# @date     03/07/2025
# @version  0.0.1
####################################################################################################

# enable mouse mode and pass "Ptmux;" escape sequences through to the terminal
# unconditional now: mouse requires tmux >= 2.1 and allow-passthrough >= 3.3, both met
# by any maintained version; the old run-shell/if-shell/bc gating was timing-dependent
# and its fallback options (mode-mouse etc) have been removed from tmux long ago
set -g mouse on
set -gw allow-passthrough on

# set the alternative prefix2 to Alt+e
set -g prefix2 M-e

# set the default terminal: tmux-256color reports italics and 24-bit color
# capabilities accurately (terminfo ships with all modern systems)
set -g default-terminal tmux-256color

# deliver Esc to inner programs within 50 ms instead of the 500 ms default,
# which makes Esc feel laggy in vim; keep 50 (not 10) so prefix2 M-e still works:
# the terminal sends Alt+e as two bytes ESC + e, and tmux only recognizes M-e when
# e arrives within escape-time after ESC; press Alt+e as a quick chord or raise to 100
set -sg escape-time 50

# let inner programs (e.g. nvim) react to terminal focus in/out events
set -g focus-events on

# set the maximum number of lines held in window history to 50000
# (raised from 5000; costs only a few MB per window but keeps long build logs readable)
set -g history-limit 50000

# set display time to 1500 ms for status line messages and other on-screen indicators
set -g display-time 1500

# renumber remaining windows of the same session once the other exited
set -g renumber-windows on

# set the key bindings to vi style in the status line
set -g status-keys vi

# set foreground and background color of status line
# must use 'colour' spelling instead of 'color' to be compatible with old versions like tmux 1.8
# light pink bar; the metrics helper uses fixed bright 256-colour severity indices
# (see colour_* knobs in status-metrics.sh) so they stay visible on this background
set -g status-fg colour236
set -g status-bg colour218

# set the base index to 1 when a new window is created
set -g base-index 1

# set status bar refresh interval to 1s
# the interval doubles as the CPU/MEM sampling window (delta between two refreshes),
# so 1s reacts to load spikes instantly; the helper caches the slow-changing segments
# (DISK/date/uptime) by TTL, keeping the per-refresh cost at ~8ms of a core
set -g status-interval 1

# set the content length and the right content of status line
# width-conditional metrics (CPU bar, MEM, DISK, Load, uptime, date) rendered by a
# /proc-based helper; replaces the previous top x2 + free fork storm that burned
# ~7-10% of a core per refresh.
# the client width is bucketed to w/m/n and the tmux server pid is appended INSIDE
# the command string: tmux deduplicates identical #() commands, so all clients of
# one tier on one server share a single sampler per refresh, and multiple servers
# (or shared-machine users) never interleave on the same CPU state file
# NOTE: width comparison must use the e|>= NUMERIC operator — bare #{>=:A,B} and
# #{m>=:A,B} compare as STRINGS / patterns, which silently misbuckets every width
# (e.g. "60" >= "120" is true lexicographically)
set -g status-left-length 20
set -g status-right-length 112
set -g status-right "#(~/.tmux/status-metrics.sh #{?#{e|>=:#{client_width},120},w,#{?#{e|>=:#{client_width},80},m,n}} #{pid})"

# set the key bindings to vi style in copy mode
set -wg mode-keys vi

# monitor for activity in the window, include inactive ones
set -wg monitor-activity on

# set word separators for double-click selection
set -wg word-separators " \\()\"',:;<>!@#\$%^&*|+=[]{}?│"

